# .mint.toml — mint configuration. Only keys that DIFFER from mint's compiled
# defaults are set here; everything else uses mint's built-in defaults.

# Everything tracked that isn't the CLI a user installs, kept out of the AI
# notes/commit diff so release notes describe the product: its source, its
# package.json, its bundle config, the README and what ships. Tests are the bulk
# of any change's diff, enough to crowd the behaviour out of the notes.
diff_exclude = [
    '.workflows/**',      # workflow specs/plans/knowledge
    '.claude/**',         # Claude Code agents, skills, settings
    '.agntc/**',          # agent tooling manifest
    '.tick/**',           # task-tracking state
    'CLAUDE.md',          # contributor rules for agents
    'design/**',          # design docs
    'demo/**',            # the README screenshots' recording setup
    'art/**',             # the README screenshots
    'tests/**',           # tests and their fixtures
    'scripts/**',         # the release gate
    'release',            # the mint wrapper
    '.github/**',         # CI plumbing
    'package-lock.json',  # lockfile noise; package.json carries the deps
    'biome.json',         # lint and format config
    'tsconfig.json',      # type-check config
    'tsconfig.test.json',
    'vitest.config.ts',
    '.gitignore',
    '.mint.toml',
]

[release.hooks]
# Gate the release on a clean-install type-check + build + test BEFORE the tag
# PONR. npm publish (.github/workflows/publish.yml) only runs AFTER the tag is
# pushed, so without this a broken build/test would leave an orphaned tag +
# GitHub release. scripts/gated passes at once a commit whose tree
# scripts/gate recorded as passing every gate, or one that changes only docs
# and the like since such a tree; anything else runs scripts/gate, which
# checks HEAD in a fresh checkout outside the repo, clean install included,
# as the CI job does. mint shows only the hook's exit, so run scripts/gated
# directly to see why it failed.
pre_tag = ['scripts/gated']
